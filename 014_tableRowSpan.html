<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table rowspan</title>
</head>
<body>

    <table border="1">
        <tr>
            <th>Name</th>
            <td colspan="2">Sarthak Kumar</td>
        </tr>
        <tr>
            <th rowspan="3">Address</th>
            <td>Village:</td>
            <td>Durgasthan</td>
        </tr>
        <tr>
            <td>City:</td>
            <td>Katihar</td>
        </tr>
        <tr>
            <td>PIN:</td>
            <td>854105</td>
        </tr>
    </table>
    
</body>
</html>
