<!DOCTYPE html>
<html lang="en">
<head>
    <title>List</title>
</head>
<body>

    <ul>
        <li>Rakesh</li>
        <li>Mukesh</li>
        <li>Rajesh</li>
        <li>Kumesh</li>
    </ul>

    <ul type="square">
        <li>Rakesh</li>
        <li>Mukesh</li>
        <li>Rajesh</li>
        <li>Kumesh</li>
    </ul>

    <ul type="circle">
        <li>Rakesh</li>
        <li>Mukesh</li>
        <li>Rajesh</li>
        <li>Kumesh</li>
    </ul>

    <ul type="none">
        <li>Rakesh</li>
        <li>Mukesh</li>
        <li>Rajesh</li>
        <li>Kumesh</li>
    </ul>
    
</body>
</html>
