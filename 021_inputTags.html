<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Tags</title>
</head>
<body>
<form action="">
    <!-- default input type with text -->
    <input type="text">

    <!-- input tag with number type  -->
     <input type="number">

    <!-- input tag with email type (username@domain.com/in)  -->
    <input type="email">

    <!-- input tag with date type  -->
    <input type="date">

    <!-- input tag with month type  -->
     <input type="month">

    <!-- input tag with week type  -->
     <input type="week">

     <!-- input tag with datetime local  -->
     <input type="datetime-local">

     <!-- input tag with color type  -->
      <input type="color" >

      <input type="checkbox">I Agree.

<br>
    <!-- input tag with submit button -->
     <input type="submit">
</form>
</body>
</html>
